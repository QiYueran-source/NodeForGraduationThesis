# 超参数配置
worker_process:
  null 
  
# 数据层线程  
# 缓存池配置  
# 最少数据(year)    
# 最大数据(year)  
# 检测间隔  
data_thread:
  min_year: 2 # 仅有1年数据后，获取数据  
  max_year: 4 # 每次获取，使得存在至少3年数据   
  check_interval: 120 # 检测间隔(s)  
  retry_interval: 30 # 重试间隔(s)  
  retry_timeout: 72000 # 重试超时时间(s)  
  exception_retry_times: 3 # 异常重试次数

# record线程
record_thread:
  record_interval: 3 # 写入间隔(s)  


# agent数据获取配置
agent:
  data:
    retry_delay: 5 # 重试间隔(s)  
    timeout: 600 # 超时时间(s)
    fallback_to_zero_when_unavailable: true # 取不到数据时是否返回全零兜底（超时或数据不存在）
