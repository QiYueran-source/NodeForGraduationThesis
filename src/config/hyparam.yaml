# 超参数配置
worker_process:
  pass 
  
# 数据层线程  
# 缓存池配置  
# 最少数据(year)    
# 最大数据(year)  
# 检测间隔  
data_thread:
  min_year: 1 # 仅有1年数据后，获取数据  
  max_year: 3 # 每次获取，使得存在至少2年数据   
  check_interval: 5 # 检测间隔(s)  
  retry_interval: 5 # 重试间隔(s)  
  retry_timeout: 300 # 重试超时时间(s)  
  exception_retry_times: 3 # 异常重试次数

# record线程
record_thread:
  record_interval: 3 # 写入间隔(s)  


# agent数据获取配置
agent:
  data:
    retry_delay: 5 # 重试间隔(s)  
    timeout: 300 # 超时时间(s)  
